name: Temporary generated-output remediation

on:
  push:
    branches:
      - chore/generated-contract-guardrails-20260903

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/generated-contract-guardrails-20260903
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install pinned flags-2-env generator
        run: |
          cargo install \
            --git https://github.com/flags-2-env/flags-2-env-cli \
            --rev a79daa64fcfeb31d8052d92273e8b78472c78b20 \
            --bin f2e

      - name: Regenerate reviewed Rust-only output
        run: bash scripts/generate-config.sh

      - name: Commit exact generator output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- generated/; then
            echo "generated output is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- generated/
          git commit -m "chore: commit pinned generated Rust projection"
          git push origin HEAD:chore/generated-contract-guardrails-20260903
