[package]
name = "act-desktop-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native AntiCapTrad desktop studio: Qt Quick/QML over a Rust media and WebRTC core"
repository = "https://github.com/anticaptrad/act-desktop-app.rs"
default-run = "act-desktop-app"

[dependencies]
act-interfaces = { git = "https://github.com/anticaptrad/act-interfaces.git", rev = "0a0a40af581adb89e8a8571afdf61cd8e66d9234", version = "0.1.0" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "1"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
font8x8 = "0.3"
fontdb = "0.24"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wait-timeout = "0.2"
webrtc = { version = "0.20.3", default-features = false, features = ["runtime-tokio"] }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
