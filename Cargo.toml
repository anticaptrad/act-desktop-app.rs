[package]
name = "act-desktop-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native AntiCapTrad desktop studio: Qt Quick/QML over a Rust media and WebRTC core"
repository = "https://github.com/anticaptrad/act-desktop-app.rs"
default-run = "act-desktop-app"

[workspace]
members = ["crates/act-creator-renderer"]
resolver = "3"

[dependencies]
act-creator-renderer = { path = "crates/act-creator-renderer" }
anyhow = "1"
cxx = "1"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webrtc = { version = "0.20.3", default-features = false, features = ["runtime-tokio"] }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
