[package]
name = "act-creator-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Private-first native creator renderer for AntiCapTrad"
repository = "https://github.com/anticaptrad/act-desktop-app.rs"

[dependencies]
act-interfaces = { git = "https://github.com/anticaptrad/act-interfaces.git", rev = "0a0a40af581adb89e8a8571afdf61cd8e66d9234", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
font8x8 = "0.3"
fontdb = "0.24"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
wait-timeout = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
